[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy2modern"
version = "0.2.0"
description = "Python SDK for Legacy2Modern metered AI refactoring MCP gateway"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Legacy2Modern" }]
keywords = ["legacy-code", "refactor", "mcp", "ai-agent", "java", "vue"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[tool.setuptools]
packages = ["legacy2modern"]
